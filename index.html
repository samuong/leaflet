<!DOCTYPE html>
<html lang="en">
<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<title>Mobile tutorial - Leaflet</title>
	
	<link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

	<style>
		html, body {
			height: 100%;
			margin: 0;
		}
		.leaflet-container {
			height: 400px;
			width: 600px;
			max-width: 100%;
			max-height: 100%;
		}
	</style>

	<style>body { padding: 0; margin: 0; } #map { height: 100%; width: 100vw; }</style>
</head>
<body>

<div id='map'></div>

<script>
	const map = L.map('map').fitWorld();

	const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 19,
		attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
	}).addTo(map);

	let locationMarker, locationCircle;

	function onLocationFound(position) {
		const latlng = {
			lat: position.coords.latitude,
			lng: position.coords.longitude
		};
		const radius = position.coords.accuracy / 2;

		if (locationMarker) {
			locationMarker.setLatLng(latlng);
			locationCircle.setLatLng(latlng).setRadius(radius);
			locationMarker.bindPopup(`You are within ${radius} meters from this point`).openPopup();
		} else {
			locationMarker = L.marker(latlng).addTo(map)
				.bindPopup(`You are within ${radius} meters from this point`).openPopup();
			locationCircle = L.circle(latlng, radius).addTo(map);
		}

		map.setView(latlng, 16);
	}

	function onLocationError(error) {
		alert(error.message);
	}

	const geoOptions = {
		enableHighAccuracy: true,
		maximumAge: 0,
		timeout: 5000
	};

	if ("geolocation" in navigator) {
		navigator.geolocation.watchPosition(onLocationFound, onLocationError, geoOptions);
	} else {
		alert("Geolocation is not supported by your browser.");
	}

	let wakeLock = null;

	const requestWakeLock = async () => {
	  try {
	    wakeLock = await navigator.wakeLock.request('screen');
	    wakeLock.addEventListener('release', () => {
	      console.log('Screen Wake Lock was released');
	    });
	    console.log('Screen Wake Lock is active');
	  } catch (err) {
	    console.error(`${err.name}, ${err.message}`);
	  }
	};

	const releaseWakeLock = async () => {
	  if (wakeLock) {
	    await wakeLock.release();
	    wakeLock = null;
	  }
	};

	document.addEventListener('visibilitychange', () => {
	  if (document.visibilityState === 'visible') {
	    requestWakeLock();
	  } else {
	    releaseWakeLock();	  }
	});

	// Request wake lock on page load
	requestWakeLock();
</script>



</body>
</html>
