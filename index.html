<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runabout</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <style>
        body {
            padding: 0;
            margin: 0;
            font-family: sans-serif;
            overflow: hidden;
        }
        html, body, #map {
            height: 100%;
            width: 100vw;
        }
        .screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }
        .screen.active { display: block; }
        #overview-screen { padding: 20px; }
        #debug-log {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px; /* Increased height for better visibility */
            background: rgba(0, 0, 0, 0.8);
            color: white;
            overflow-y: scroll;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            box-sizing: border-box;
            z-index: 9999;
            display: none; /* Hidden by default */
        }
        #debug-log.active { display: block; }
        #debug-log p { margin: 0 0 5px 0; line-height: 1.2; }
        button { margin-top: 10px; padding: 10px 15px; font-size: 16px; cursor: pointer; }

        /* Styling for the less prominent debug button */
        #toggleDebugButton {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 12px;
            padding: 5px 10px;
            background-color: #f0f0f0;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 5px;
            z-index: 10000; /* Ensure it's above other content */
            margin-top: 0; /* Override default button margin */
        }
    </style>
</head>
<body>
    <div id="overview-screen" class="screen active">
        <h1>Welcome to Runabout!</h1>
        <button id="startButton">Start</button>
    </div>

    <div id="navigation-screen" class="screen">
        <div id="map"></div>
    </div>

    <div id="debug-log"></div>
    <button id="toggleDebugButton"></button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <script>
        const overviewScreen = document.getElementById('overview-screen');
        const navigationScreen = document.getElementById('navigation-screen');
        const startButton = document.getElementById('startButton');
        const toggleDebugButton = document.getElementById('toggleDebugButton');
        const debugLog = document.getElementById('debug-log');

        let wakeLock = null;
        let isDebugModeActive = localStorage.getItem('isDebugModeActive') === 'true';
        let mapInstance = null; // Global variable to hold the Leaflet map instance

        function logToScreen(message) {
            const p = document.createElement('p');
            p.textContent = new Date().toLocaleTimeString() + ': ' + message;
            debugLog.appendChild(p);
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        function appLog(message) {
            if (isDebugModeActive) {
                logToScreen(message);
            }
            // Still log to console for desktop debugging convenience
            console.log(message);
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        appLog('Wake Lock was released');
                    });
                    appLog('Wake Lock was acquired');
                } catch (err) {
                    if (err.name === 'NotAllowedError') {
                        appLog(`Wake Lock request denied: ${err.message}. User gesture required or permission denied.`);
                    } else {
                        appLog(`Wake Lock error: ${err.name}, ${err.message}`);
                    }
                }
            } else {
                appLog('Wake Lock API not supported in this browser.');
            }
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        function updateDebugDisplay() {
            if (isDebugModeActive) {
                debugLog.classList.add('active');
                toggleDebugButton.textContent = 'Disable Debugging';
            } else {
                debugLog.classList.remove('active');
                toggleDebugButton.textContent = 'Enable Debugging';
            }
        }

        function initializeMap() {
            if (mapInstance !== null) {
                mapInstance.remove(); // Remove existing map if any
            }
            mapInstance = L.map('map').fitWorld();

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(mapInstance);

            mapInstance.locate({setView: true, maxZoom: 16});

            function onLocationFound(e) {
                var radius = e.accuracy;

                L.marker(e.latlng).addTo(mapInstance)
                    .bindPopup("You are within " + radius + " meters from this point").openPopup();

                L.circle(e.latlng, radius).addTo(mapInstance);
            }

            mapInstance.on('locationfound', onLocationFound);

            function onLocationError(e) {
                alert(e.message);
            }

            mapInstance.on('locationerror', onLocationError);
            appLog('Leaflet map initialized.'); // Add log for map initialization
        }
        function showScreen(screenName) {
            overviewScreen.classList.remove('active');
            navigationScreen.classList.remove('active');

            if (screenName === 'overview') {
                overviewScreen.classList.add('active');
                releaseWakeLock();
                if (mapInstance !== null) {
                    mapInstance.remove();
                    mapInstance = null; // Clear the reference
                    appLog('Leaflet map disposed.');
                }
            } else if (screenName === 'navigation') {
                navigationScreen.classList.add('active');
                initializeMap();
            }
        }

        startButton.addEventListener('click', () => {
            history.pushState({ screen: 'navigation' }, '', '#navigation');
            showScreen('navigation');
            requestWakeLock(); // Directly tied to user gesture
        });

        toggleDebugButton.addEventListener('click', () => {
            isDebugModeActive = !isDebugModeActive;
            localStorage.setItem('isDebugModeActive', isDebugModeActive);
            updateDebugDisplay();
            appLog(`Debug mode ${isDebugModeActive ? 'enabled' : 'disabled'}`);
        });

        window.addEventListener('popstate', (event) => {
            const targetScreen = event.state && event.state.screen ? event.state.screen : 'overview';
            showScreen(targetScreen);
            if (targetScreen === 'navigation') {
                requestWakeLock(); // Directly tied to user gesture (back button)
            } else {
                releaseWakeLock(); // Release if navigating away from navigation screen
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && navigationScreen.classList.contains('active')) {
                appLog('Visibility changed to visible while on navigation screen, re-requesting Wake Lock.');
                requestWakeLock();
            } else if (document.visibilityState === 'hidden' && wakeLock) {
                appLog('Page hidden, Wake Lock likely released by browser.');
            }
        });

        // Initial screen setup based on URL hash and debug display
        if (window.location.hash === '#navigation') {
            showScreen('navigation');
            requestWakeLock(); // Request on initial load if directly on #navigation
        } else {
            showScreen('overview');
            releaseWakeLock(); // Ensure it's released if starting on overview
        }
        updateDebugDisplay(); // Set initial visibility of debug log and button text
    </script>
</body>
</html>
